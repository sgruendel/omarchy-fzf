name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install search dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fd-find fzf
          if ! command -v fd >/dev/null 2>&1; then
            sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
          fi

      - name: Run tests
        run: node --test
